<!-- public/index.html -->
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sinatra Todo App (Vanilla JS)</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <div class="todo-box">
        <h2>Ma Liste de Tâches</h2>
        
        <form id="todo-form" class="todo-form">
            <input type="text" id="todo-input" placeholder="Ajouter une tâche..." required />
            <button type="submit">Ajouter</button>
        </form>

        <ul id="todo-list" class="todo-list"></ul>
    </div>

    <script>
        const todoList = document.getElementById('todo-list');
        const todoForm = document.getElementById('todo-form');
        const todoInput = document.getElementById('todo-input');

        // 1. LIRE : Charger les tâches depuis Sinatra
        async function loadTodos() {
            const res = await fetch('/api/todos');
            const todos = await res.json();
            
            todoList.innerHTML = ''; 
            
            todos.forEach(todo => {
                const li = document.createElement('li');
                if (todo.completed) li.classList.add('completed');
                
                li.innerHTML = `
                    <span onclick="toggleTodo(${todo.id}, ${todo.completed})">${todo.title}</span>
                    <button class="delete-btn" onclick="deleteTodo(${todo.id})">❌</button>
                `;
                todoList.appendChild(li);
            });
        }

        // 2. CRÉER : Ajouter une nouvelle tâche
        todoForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = todoInput.value.trim();
            if (!title) return;

            await fetch('/api/todos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title })
            });

            todoInput.value = '';
            loadTodos(); 
        });

        // 3. MODIFIER : Inverser le statut (Terminé / En cours)
        async function toggleTodo(id, currentStatus) {
            await fetch(`/api/todos/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ completed: !currentStatus })
            });
            loadTodos();
        }

        // 4. SUPPRIMER : Effacer une tâche
        async function deleteTodo(id) {
            await fetch(`/api/todos/${id}`, { method: 'DELETE' });
            loadTodos();
        }

        // Lancement au chargement de la page
        loadTodos();
    </script>
</body>
</html>
